<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo de Jogos</title>
  <link rel="icon" type="image/png" href="./assets/icone.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <a class="logo" href="index.html"><img src="./assets/icone.png" alt=""><h1>Catálogo de Jogos</h1></a>
    <div class="search-area">
      <i data-icon="search"></i>
      <input type="search" id="pesquisa" placeholder="Pesquisar por nome, gênero, plataforma ou ano...">
    </div>
    <a class="btn btn-primary" href="form.html" target="_blank" rel="noopener"><i data-icon="plus"></i>Novo Jogo</a>
  </header>

  <main class="container">
    <div class="page-title">
      <h2>Catálogo</h2>
      <span id="quantidade"></span>
    </div>
    <div id="lista" class="games-grid"></div>
  </main>

  <footer>Direitos reservados: Alison, Arthur, Eraldo, Samara, Thiago.</footer>
  <script src="js/icons.js"></script>
  <script src="js/api.js"></script>
  <script src="js/index.js"></script>
</body>
</html>
